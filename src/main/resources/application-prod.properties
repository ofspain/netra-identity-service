# AWS ElastiCache in cluster mode
spring.redis.cluster-enabled=true
spring.redis.cluster.nodes=my-redis-cluster.xxxxxx.clustercfg.use1.cache.amazonaws.com:6379
spring.redis.cluster.max-redirects=5

# If AUTH/ACL enabled
# spring.redis.username=myuser
# spring.redis.password=supersecret

# Production timeouts and pool sizes
spring.redis.timeout=5000
spring.redis.lettuce.refresh-period=60
spring.redis.lettuce.pool.max-idle=50
spring.redis.lettuce.pool.min-idle=5
spring.redis.lettuce.pool.max-active=100
spring.redis.lettuce.pool.max-wait=-1
spring.redis.lettuce.pool.time-between-eviction-runs-millis=300000

application.env=prod
