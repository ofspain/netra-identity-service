
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-here}
app.jwt.expiration=60
app.app.jwt.audience=${JWT_AUDIENCE:internal-apis}

# For test containers / local test Redis
spring.redis.cluster-enabled=false
spring.redis.standalone.host=localhost
spring.redis.standalone.port=6379

# Very tight timeout for fast failures
spring.redis.timeout=1000
spring.redis.lettuce.refresh-period=10
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-wait=100
spring.redis.lettuce.pool.time-between-eviction-runs-millis=30000

application.env=test