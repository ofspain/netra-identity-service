spring.application.name=authrex

# API-Only Security Configuration (Flat Structure)

spring.web.resources.add-mappings=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.security.filter.order=0
spring.main.allow-circular-references=true

# Disable all web UI features
thymeleaf.cache=true
mvc.servlet.load-on-startup=1
resources.static-locations=classpath:/


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=true


springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/no-docs
springdoc.swagger-ui.path=/no-ui

# JWT Configuration

app.jwt.secret=${JWT_SECRET:your-256-bit-secret-here}
app.jwt.expiration=${JWT_EXPIRATION:3600}
app.jwt.issuer=${JWT_ISSUER:authrex-service}
app.app.jwt.audience=${JWT_AUDIENCE:internal-apis}

# Security Headers (Applied via filter)
security.headers=
hsts=none
xss=block
frame-options=deny
content-security-policy=default-src 'none'; script-src 'none'; style-src 'none'


max.days.allowed.password.lifetime=90